<!DOCTYPE html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guild Dashboard</title>
  <link rel="stylesheet" href="style.css">
  
</head>
<body>

  <header class="top-bar">
    <div class="logo">Guild Hub</div>

    <nav class="nav-links">
      <a href="index.html" class="nav-button active">Dashboard</a>
      <a href="Events.html" class="nav-button">Events</a>
      <a href="objectives.html" class="nav-button">Objectives</a>
      <a href="members.html" class="nav-button">Members</a>
      <a href="settings.html" class="nav-button">Settings</a>
    </nav>
  </header>

  <main class="dashboard">

    <div class="left-column">

      <section class="events-section">
        <h1 class="section-title">Guild Events</h1>
        <div id="event-list" class="event-list"></div>
      </section>

      <section class="players-section">
        <h2 class="section-title">Guild Members</h2>
        <div id="player-grid" class="player-grid"></div>
      </section>

    </div>

    <section class="guild-section">
      <img id="guild-image" class="guild-image" src="" alt="Guild image">

      <h2 id="guild-name" class="guild-name"></h2>

      <p id="guild-level" class="guild-level"></p>

      <p id="guild-description" class="guild-description"></p>
    </section>

  </main>

  <script src="Dashboard.js"></script>
</body>
</html>
